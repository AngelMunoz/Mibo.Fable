<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mibo.Fable browser tests</title>
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script type="module">
      import { QUnit } from "qunit";

      window.__failures = [];
      QUnit.config.autostart = false;
      QUnit.on("testEnd", (test) => {
        if (test.status !== "failed") {
          return;
        }
        const messages = test.assertions
          .filter((a) => !a.passed)
          .map((a) => a.message);
        window.__failures.push({ name: test.fullName, messages });
      });
      QUnit.on("runEnd", (details) => {
        window.__runEnd = {
          status: details.status,
          counts: details.testCounts,
          runtime: details.runtime,
          failures: window.__failures,
        };
        document.title = "RUN_END " + details.status;
      });

      await import("./QUnit.Tests.fs.js");
      await import("./Adaptive.Tests.fs.js");
      await import("./MapTests.fs.js");
      await import("./SetTests.fs.js");
      await import("./ListTests.fs.js");
      await import("./ThreeConversions.Tests.fs.js");
      await import("./ThreeBindings.Tests.fs.js");
      await import("./ThreeHost.Tests.fs.js");
      await import("./ThreeHost.Browser.Tests.fs.js");
      QUnit.start();
    </script>
  </body>
</html>
