<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mibo.Fable.ThreeJS - Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0b0e13;
        color: #e6edf3;
        font-family: monospace;
      }
      .panels {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .panel .label {
        font-weight: bold;
      }
      canvas {
        border: 1px solid #2a3038;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>Three.js foundation: one MVU cube and one signals cube. Click a canvas to reverse spin.</div>
    <div class="panels">
      <div class="panel">
        <div class="label">MVU cube</div>
        <canvas id="stage-three-mvu" width="480" height="320"></canvas>
      </div>
      <div class="panel">
        <div class="label">Signals cube</div>
        <canvas id="stage-three-adaptive" width="480" height="320"></canvas>
      </div>
    </div>
    <script type="module" src="/Main.fs.js"></script>
  </body>
</html>
